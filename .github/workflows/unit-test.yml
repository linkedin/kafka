name: unitTest

on:
  workflow_call:
  pull_request:
    # Restrict the branches so pull requests do not run duplicate checks.
    branches:
      - 3.0-li
      - 3.0-li-**

jobs:
  test:
    # Name the Job
    name: ${{ matrix.module }}_${{ matrix.scalaVersion }}
    # Set the type of machine to run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # We still want to see all jobs' build result to the end
      max-parallel: 4
      matrix:
        scalaVersion:
          - 2.12
        module: # Maintain lexicographical order
          - clients
          - core
          - generator
          - metadata
          - raft
          - server-common
          - shell
          - storage
          - storage:api
    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The Gradle versions plugin needs the ancestor tags.
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The file-backed SSL fixtures require this tested JDK patch version.
          java-version: '11.0.21'
          cache: gradle
      - name: Run tests
        env:
          SCALA_VERSION: ${{ matrix.scalaVersion }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-PscalaVersion=${SCALA_VERSION}" \
            -PmaxTestRetries=3 -PtestLoggingEvents=started,passed,skipped,failed \
            cleanTest "${MODULE}:unitTest"
